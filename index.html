<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>细胞演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0e1a;
      color: #e0e8ff;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 14px 24px 8px;
      text-align: center;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #88ccff;
      text-shadow: 0 0 20px rgba(100, 180, 255, 0.5);
    }

    header p {
      font-size: 0.75rem;
      color: #556;
      margin-top: 2px;
      letter-spacing: 0.08em;
    }

    #canvas-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      cursor: crosshair;
    }

    #controls {
      display: flex;
      gap: 10px;
      padding: 10px 16px 14px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 6px 18px;
      border: 1px solid #334;
      background: #111827;
      color: #99bbdd;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.04em;
    }

    button:hover {
      background: #1e3050;
      border-color: #557;
      color: #cce;
    }

    button.active {
      background: #143060;
      border-color: #4488cc;
      color: #88ccff;
      box-shadow: 0 0 10px rgba(68, 136, 204, 0.3);
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: #667;
    }

    .slider-group label { color: #889aaa; }

    input[type=range] {
      -webkit-appearance: none;
      width: 80px;
      height: 3px;
      background: #223;
      border-radius: 2px;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      background: #4488cc;
      border-radius: 50%;
      cursor: pointer;
    }

    #stats {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 0.7rem;
      color: #334455;
      line-height: 1.7;
      pointer-events: none;
    }

    #legend {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 0.68rem;
      color: #445;
      line-height: 1.8;
      pointer-events: none;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<header>
  <h1>细 胞 演 示</h1>
  <p>点击画面添加细胞 · Click to add cells</p>
</header>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
  <div id="stats"></div>
  <div id="legend">
    <div><span class="dot" style="background:#5bf"></span>初级细胞</div>
    <div><span class="dot" style="background:#f85"></span>活跃细胞</div>
    <div><span class="dot" style="background:#8f5"></span>分裂细胞</div>
    <div><span class="dot" style="background:#c8f"></span>衰老细胞</div>
  </div>
</div>

<div id="controls">
  <button id="btn-pause">暂停</button>
  <button id="btn-reset">重置</button>
  <button id="btn-burst">爆发添加</button>
  <div class="slider-group">
    <label>速度</label>
    <input type="range" id="sl-speed" min="0.2" max="3" step="0.1" value="1">
  </div>
  <div class="slider-group">
    <label>密度上限</label>
    <input type="range" id="sl-max" min="20" max="300" step="10" value="120">
    <span id="max-label">120</span>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const stats = document.getElementById('stats');

let W, H;
function resize() {
  const wrap = document.getElementById('canvas-wrap');
  W = canvas.width  = wrap.clientWidth;
  H = canvas.height = wrap.clientHeight;
}
resize();
window.addEventListener('resize', resize);

/* ── Cell types ── */
const TYPES = {
  JUVENILE: { color: '#55bbff', glow: 'rgba(85,187,255,', minR: 4,  maxR: 8,  speed: 1.4, life: 600 },
  ACTIVE:   { color: '#ff8855', glow: 'rgba(255,136,85,', minR: 6,  maxR: 11, speed: 1.0, life: 800 },
  DIVIDING: { color: '#88ff55', glow: 'rgba(136,255,85,', minR: 9,  maxR: 14, speed: 0.6, life: 400 },
  SENESCENT:{ color: '#cc88ff', glow: 'rgba(204,136,255,',minR: 10, maxR: 16, speed: 0.3, life: 1000 },
};
const TYPE_KEYS = Object.keys(TYPES);

let cells = [];
let particles = [];
let paused = false;
let speedMult = 1;
let maxCells = 120;
let tick = 0;

/* ── Particle ── */
class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.color = color;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = (Math.random() - 0.5) * 2;
    this.life = 1;
    this.r = Math.random() * 2 + 1;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.95;
    this.vy *= 0.95;
    this.life -= 0.03;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.life * 0.7;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

/* ── Cell ── */
class Cell {
  constructor(x, y, typeKey) {
    this.x = x;
    this.y = y;
    this.typeKey = typeKey || TYPE_KEYS[Math.floor(Math.random() * TYPE_KEYS.length)];
    const t = TYPES[this.typeKey];
    this.r = t.minR + Math.random() * (t.maxR - t.minR);
    this.maxR = t.minR + Math.random() * (t.maxR - t.minR);
    this.r = t.minR;
    this.growTarget = this.maxR;
    this.angle = Math.random() * Math.PI * 2;
    this.speed = t.speed * (0.7 + Math.random() * 0.6);
    this.vx = Math.cos(this.angle) * this.speed;
    this.vy = Math.sin(this.angle) * this.speed;
    this.life = t.life * (0.8 + Math.random() * 0.4);
    this.age = 0;
    this.divideAt = this.life * 0.5;
    this.divided = false;
    this.pulse = Math.random() * Math.PI * 2;
    this.wobble = 0;
    this.membrane = Math.random() * 0.3 + 0.1;
  }

  get type() { return TYPES[this.typeKey]; }

  update(dt) {
    this.age += dt;
    this.pulse += dt * 0.04;

    // grow
    if (this.r < this.growTarget) this.r += dt * 0.05;

    // wander
    this.angle += (Math.random() - 0.5) * 0.15;
    const t = this.type;
    this.vx += Math.cos(this.angle) * t.speed * 0.04;
    this.vy += Math.sin(this.angle) * t.speed * 0.04;
    const maxV = t.speed * 1.5;
    const spd = Math.hypot(this.vx, this.vy);
    if (spd > maxV) { this.vx = this.vx / spd * maxV; this.vy = this.vy / spd * maxV; }

    this.x += this.vx * dt * speedMult;
    this.y += this.vy * dt * speedMult;

    // bounce
    if (this.x < this.r)      { this.x = this.r;      this.vx = Math.abs(this.vx); }
    if (this.x > W - this.r)  { this.x = W - this.r;  this.vx = -Math.abs(this.vx); }
    if (this.y < this.r)      { this.y = this.r;       this.vy = Math.abs(this.vy); }
    if (this.y > H - this.r)  { this.y = H - this.r;  this.vy = -Math.abs(this.vy); }

    // divide
    if (!this.divided && this.age >= this.divideAt && cells.length < maxCells) {
      this.divided = true;
      const nextType = TYPE_KEYS[(TYPE_KEYS.indexOf(this.typeKey) + 1) % TYPE_KEYS.length];
      const child = new Cell(
        this.x + (Math.random() - 0.5) * this.r * 2,
        this.y + (Math.random() - 0.5) * this.r * 2,
        nextType
      );
      cells.push(child);
      spawnParticles(this.x, this.y, this.type.color, 8);
    }

    this.wobble = Math.sin(this.pulse) * this.membrane;
  }

  draw() {
    const t = this.type;
    const ratio = this.age / this.life;
    const alpha = ratio < 0.1 ? ratio / 0.1 : ratio > 0.8 ? 1 - (ratio - 0.8) / 0.2 : 1;

    // glow
    const grd = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.r * 2.5);
    grd.addColorStop(0, t.glow + (alpha * 0.25) + ')');
    grd.addColorStop(1, t.glow + '0)');
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();

    // membrane (wobbly ellipse)
    ctx.save();
    ctx.globalAlpha = alpha * 0.85;
    ctx.translate(this.x, this.y);
    ctx.scale(1 + this.wobble, 1 - this.wobble);
    const body = ctx.createRadialGradient(0, -this.r * 0.3, 0, 0, 0, this.r);
    body.addColorStop(0, t.glow + '0.7)');
    body.addColorStop(0.7, t.glow + '0.4)');
    body.addColorStop(1, t.glow + '0.15)');
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.fillStyle = body;
    ctx.fill();

    // border
    ctx.strokeStyle = t.color;
    ctx.lineWidth = 1;
    ctx.globalAlpha = alpha * 0.6;
    ctx.stroke();

    // nucleus
    ctx.globalAlpha = alpha * 0.5;
    ctx.beginPath();
    ctx.arc(0, 0, this.r * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = t.color;
    ctx.fill();

    ctx.restore();
  }

  isDead() { return this.age >= this.life; }
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) particles.push(new Particle(x, y, color));
}

function spawnCell(x, y) {
  if (cells.length < maxCells) cells.push(new Cell(x, y));
}

function init() {
  cells = [];
  particles = [];
  tick = 0;
  const n = Math.min(30, maxCells);
  for (let i = 0; i < n; i++) spawnCell(Math.random() * W, Math.random() * H);
}

/* ── Render connections ── */
function drawConnections() {
  const maxDist = 80;
  for (let i = 0; i < cells.length; i++) {
    for (let j = i + 1; j < cells.length; j++) {
      const dx = cells[i].x - cells[j].x;
      const dy = cells[i].y - cells[j].y;
      const d = Math.hypot(dx, dy);
      if (d < maxDist) {
        const a = (1 - d / maxDist) * 0.12;
        ctx.beginPath();
        ctx.moveTo(cells[i].x, cells[i].y);
        ctx.lineTo(cells[j].x, cells[j].y);
        ctx.strokeStyle = `rgba(120,160,200,${a})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
}

/* ── Main loop ── */
let last = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min((ts - last) / 16, 3);
  last = ts;
  if (paused) return;

  tick++;

  // background fade
  ctx.fillStyle = 'rgba(10,14,26,0.18)';
  ctx.fillRect(0, 0, W, H);

  drawConnections();

  // update & draw particles
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) { p.update(); p.draw(); }

  // update & draw cells
  for (const c of cells) { c.update(dt); c.draw(); }
  cells = cells.filter(c => {
    if (c.isDead()) { spawnParticles(c.x, c.y, c.type.color, 5); return false; }
    return true;
  });

  // auto replenish
  if (tick % 90 === 0 && cells.length < maxCells * 0.4) {
    spawnCell(Math.random() * W, Math.random() * H);
  }

  // stats
  const counts = {};
  for (const k of TYPE_KEYS) counts[k] = 0;
  for (const c of cells) counts[c.typeKey]++;
  stats.innerHTML =
    `细胞总数: ${cells.length}<br>` +
    `初级: ${counts.JUVENILE} · 活跃: ${counts.ACTIVE}<br>` +
    `分裂: ${counts.DIVIDING} · 衰老: ${counts.SENESCENT}`;
}

/* ── Controls ── */
canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  spawnCell(e.clientX - r.left, e.clientY - r.top);
});

document.getElementById('btn-pause').addEventListener('click', function() {
  paused = !paused;
  this.textContent = paused ? '继续' : '暂停';
  this.classList.toggle('active', paused);
});

document.getElementById('btn-reset').addEventListener('click', init);

document.getElementById('btn-burst').addEventListener('click', () => {
  const n = Math.min(20, maxCells - cells.length);
  for (let i = 0; i < n; i++) {
    setTimeout(() => spawnCell(Math.random() * W, Math.random() * H), i * 60);
  }
});

document.getElementById('sl-speed').addEventListener('input', function() {
  speedMult = parseFloat(this.value);
});

document.getElementById('sl-max').addEventListener('input', function() {
  maxCells = parseInt(this.value);
  document.getElementById('max-label').textContent = maxCells;
});

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
